services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aliyun-dashboard-backend
    restart: always
    expose:
      - "8000"
    volumes:
      - ./data:/app/data # SQLite 数据单文件挂载保存目录
    environment:
      - DB_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/aliyun.db
      - "ASSETVISTA_MASTER_KEY=${ASSETVISTA_MASTER_KEY:?Error: ASSETVISTA_MASTER_KEY MUST BE PROVIDED IN ENVIRONMENT}"
      - "SETTINGS_ADMIN_PASSWORD=${SETTINGS_ADMIN_PASSWORD:?Error: SETTINGS_ADMIN_PASSWORD MUST BE PROVIDED IN ENVIRONMENT}"
      - TZ=Asia/Shanghai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aliyun-dashboard-frontend
    restart: always
    environment:
      - "SETTINGS_ADMIN_PASSWORD=${SETTINGS_ADMIN_PASSWORD:?Error: SETTINGS_ADMIN_PASSWORD MUST BE PROVIDED IN ENVIRONMENT}"
    ports:
      - "127.0.0.1:81:80"
    depends_on:
      - backend
