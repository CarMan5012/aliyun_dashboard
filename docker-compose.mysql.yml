# ─────────────────────────────────────────────────────────────────────────────
# 阿里云资产看板 - 完整企业集群模式 (MySQL 8.0 + Redis + Celery Worker)
# 启动方式: docker-compose -f docker-compose.mysql.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: mysql:8.0
    container_name: aliyun-dashboard-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: assetvista
    ports:
      - "3116:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: aliyun-dashboard-redis
    restart: always
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aliyun-dashboard-backend
    restart: always
    expose:
      - "8000"
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DB=assetvista
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - "ASSETVISTA_MASTER_KEY=${ASSETVISTA_MASTER_KEY:?Error: ASSETVISTA_MASTER_KEY MUST BE PROVIDED IN ENVIRONMENT}"
      - "SETTINGS_ADMIN_PASSWORD=${SETTINGS_ADMIN_PASSWORD:?Error: SETTINGS_ADMIN_PASSWORD MUST BE PROVIDED IN ENVIRONMENT}"
      - TZ=Asia/Shanghai
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aliyun-dashboard-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info -B --concurrency=2
    restart: always
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DB=assetvista
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - "ASSETVISTA_MASTER_KEY=${ASSETVISTA_MASTER_KEY:?Error: ASSETVISTA_MASTER_KEY MUST BE PROVIDED IN ENVIRONMENT}"
      - "CHINA_HOLIDAY_RANGES=${CHINA_HOLIDAY_RANGES:-2026-01-01:2026-01-03,2026-02-15:2026-02-23,2026-04-04:2026-04-06,2026-05-01:2026-05-05,2026-06-19:2026-06-21,2026-09-25:2026-09-27,2026-10-01:2026-10-07}"
      - "CHINA_EXTRA_WORKDAYS=${CHINA_EXTRA_WORKDAYS:-2026-01-04,2026-02-14,2026-02-28,2026-05-09,2026-09-20,2026-10-10}"
      - TZ=Asia/Shanghai
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aliyun-dashboard-frontend
    restart: always
    environment:
      - "SETTINGS_ADMIN_PASSWORD=${SETTINGS_ADMIN_PASSWORD:?Error: SETTINGS_ADMIN_PASSWORD MUST BE PROVIDED IN ENVIRONMENT}"
    ports:
      - "127.0.0.1:81:80"
    depends_on:
      - backend

volumes:
  mysql_data:
